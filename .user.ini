; Redex Glass — PHP ayarları (PHP-FPM/LSAPI/CGI .user.ini olarak okur; mod_php okumaz)
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off
post_max_size = 12M
upload_max_filesize = 8M
max_file_uploads = 3
max_input_vars = 500
max_execution_time = 30
memory_limit = 256M
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200
; CVE-2026-109619 (PHP2Shell) icin gecici azaltim — asil cozum PHP'yi 8.2.35/8.3.36/8.4.27+ yapmak
session.upload_progress.enabled = 0
